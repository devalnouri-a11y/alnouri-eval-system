name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage and validate branded form
        shell: python
        run: |
          from pathlib import Path
          import re, base64
          logo = ''
          assert base64.b64decode(logo)[:4] == b'RIFF'
          original = Path('evaluation-form.html').read_text(encoding='utf-8')
          image = '<img class="alnouri-official-logo" src="data:image/webp;base64,' + logo + '" alt="جمعية الشيخ عبد الله النوري الخيرية" width="200" height="63">'
          html, count = re.subn(r'<svg class="logo-svg"[\s\S]*?</svg>', lambda m: image, original, count=1)
          assert count == 1, 'Expected original logo placeholder'
          css = '<style>.alnouri-official-logo{display:block;width:200px;max-width:100%;height:auto;background:white;padding:6px;border-radius:8px;object-fit:contain;flex-shrink:0}.header-inner,.logo-group{flex-wrap:wrap}@media(max-width:600px){.logo-group{width:100%}.header-actions{margin-inline-start:auto}}</style>'
          html = html.replace('</head>', css + '</head>', 1)
          assert re.findall(r'<script\b[\s\S]*?</script>', original) == re.findall(r'<script\b[\s\S]*?</script>', html)
          assert 'id="proj-name"' in html
          target = Path('_site')
          target.mkdir(exist_ok=True)
          (target / 'evaluation-form.html').write_text(html, encoding='utf-8')
          (target / 'index.html').write_bytes(Path('index.html').read_bytes())
          (target / '.nojekyll').touch()
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
