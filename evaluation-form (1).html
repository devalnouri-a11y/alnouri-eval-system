document.getElementById('patch').onclick=async()=>{
 const status=document.getElementById('status');
 try{
 const file=document.getElementById('source').files[0];if(!file)throw Error('اختر ملف النموذج أولاً.');
 let html=await file.text();

 const pattern=/<svg\b[^>]*class=["'][^"']*\blogo-svg\b[^"']*["'][\s\S]*?<\/svg>/i;
 if(pattern.test(html))html=html.replace(pattern,image);
 else if(!html.includes('class="alnouri-official-logo"')){
 if(!/<body\b[^>]*>/i.test(html))throw Error('الملف المحدد ليس صفحة HTML متوقعة.');
 html=html.replace(/<body\b[^>]*>/i,m=>m+'<div style="padding:16px;text-align:center">'+image+'</div>');}
 const css='<style id="alnouri-logo-style">.alnouri-official-logo{display:block;width:min(360px,100%);height:auto;object-fit:contain;background:#fff;padding:8px;border-radius:8px;flex-shrink:0}.header .logo-group{flex-wrap:wrap;min-width:0}.header-inner{flex-wrap:wrap}@media(max-width:600px){.header .logo-group{width:100%}.alnouri-official-logo{width:min(300px,100%)}.header .header-actions{margin-inline-start:auto}}@media print{.alnouri-official-logo{max-width:320px}}</style>';
 if(!html.includes('id="alnouri-logo-style"'))html=html.replace(/<\/head>/i,css+'</head>');
 const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='evaluation-form.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
